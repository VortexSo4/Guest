pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = 'https://maven.fabricmc.net'
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Guest'

def modules = ['Core', 'Atmosphere', 'Wilds', 'Settlements', 'Architects', 'Hands']
    .findAll { file("${it}/common").directory }
gradle.ext.guestModules = modules

modules.each { module ->
    ['common', 'neoforge', 'fabric'].each { side ->
        include "${module}:${side}"
    }
}

include 'Runs:neoforge'
include 'Runs:fabric'
