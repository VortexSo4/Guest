import java.util.regex.Pattern

plugins {
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'net.fabricmc.fabric-loom' version '1.18.2' apply false
    id 'me.champeau.jmh' version '0.7.3' apply false
    id 'com.diffplug.spotless' version '7.0.2' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

allprojects {
    apply plugin: 'idea'
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

subprojects {
    plugins.withId('java') {
        apply plugin: 'com.diffplug.spotless'

        spotless {
            java {
                target 'src/**/*.java'
                targetExclude '**/build/**', '**/generated/**'

                googleJavaFormat('1.28.0')

                removeUnusedImports()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }
    }

    if (name == 'common') {
        plugins.withId('java') {
            apply plugin: 'me.champeau.jmh'

            jmh {
                warmupIterations = 3
                warmup = '1s'

                iterations = 5
                timeOnIteration = '1s'

                fork = 1
                threads = 1

                timeUnit = 'ns'

                zip64 = true

                if (rootProject.hasProperty('benchmark')) {
                    String requested =
                            rootProject.property('benchmark').toString()

                    includes = [
                            '^' + Pattern.quote(requested) + '(\\..*)?$'
                    ]
                }
            }
        }
    }
}

tasks.register('benchmark') {
    group = 'verification'
    description = 'Run JMH benchmarks.'

    dependsOn(
            subprojects.collectMany { project ->
                if (project.name != 'common' || !project.file('src/jmh/java').exists()) {
                    return []
                }
                return [project.path + ':jmh']
            }
    )
}
