license="${mod_license}"

[[mods]]

modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="Vortex_So"

description='''
Villages that keep living while you are away. Includes an aggregate simulation of food, housing, births and losses, lunar rites and mourning at the village bell, villagers trading with each other, caravans on the roads between villages, memories built on vanilla gossip, seasonal illager patrols.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.guest_settlements]]
    modId = "guest_core"
    type = "required"
    versionRange = "[1.0.0,)"
    ordering = "AFTER"
    side = "BOTH"