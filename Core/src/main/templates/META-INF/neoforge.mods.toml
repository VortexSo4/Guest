license="${mod_license}"

[[mods]]

modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="Vortex_So"

description='''
Shared library for the Guest addons: calendar, deterministic world primitives, weather/wildlife read-only contracts, sparse world history, cross-addon events and debug tools. Adds no gameplay content.
'''

